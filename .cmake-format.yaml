---
format:
  disable: false
  line_width: 120
  tab_size: 4
  use_tabchars: false
  fractional_tab_policy: use-space
  max_subgroups_hwrap: 2
  max_pargs_hwrap: 6
  max_rows_cmdline: 2
  separate_ctrl_name_with_space: true
  separate_fn_name_with_space: false
  dangle_parens: true
  dangle_align: prefix
