name: Quality Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Quality Assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CC: clang
      CXX: clang++
      FUZZER_TIME: 30
      STRICT_CI: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            clang \
            clang-tidy \
            clang-format \
            llvm \
            cppcheck \
            pipx

      - name: Install Python tools
        run: |
          pipx install conan
          pipx install gcovr
          pipx install cmake-format
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare Conan profile
        run: |
          PROFILE_PATH="$(./scripts/ci-conan-profile.sh)"
          echo "CONAN_PROFILE=${PROFILE_PATH}" >> "$GITHUB_ENV"
          echo "Using Conan profile at ${PROFILE_PATH}"
          cat "${PROFILE_PATH}"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Build (Release)
        run: make build

      - name: Run tests
        run: |
          set -o pipefail
          make test 2>&1 | tee test-output.txt

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Test results"
            echo '```'
            tail -n 40 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

      - name: Static analysis
        run: make analyze

      - name: Security analysis
        run: make security

      - name: Coverage
        run: make coverage

      - name: Sanitizer (ASan/UBSan)
        run: make sanitize

      - name: Fuzzer smoke test
        run: make fuzzer-smoke

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/build/Debug/coverage.html
          if-no-files-found: ignore
