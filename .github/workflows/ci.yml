name: Quality Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Quality Assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CC: clang
      CXX: clang++
      LLVM_VERSION: "22"
      FUZZER_TIME: 30
      MIN_LINE_COVERAGE: 85
      STRICT_CI: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM toolchain
        run: ./scripts/ci-install-llvm.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            cppcheck \
            pipx

      - name: Install Python tools
        run: |
          pipx install conan
          pipx install gcovr
          pipx install cmakelang
          pipx inject cmakelang pyyaml
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare Conan profile
        run: |
          PROFILE_PATH="$(./scripts/ci-conan-profile.sh)"
          echo "CONAN_PROFILE=${PROFILE_PATH}" >> "$GITHUB_ENV"
          echo "Using Conan profile at ${PROFILE_PATH}"
          cat "${PROFILE_PATH}"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Build (Release)
        run: make build

      - name: Run tests
        run: |
          set -o pipefail
          make test

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Test results"
            if [ -f report/test/test-report.txt ]; then
              echo '```'
              tail -n 40 report/test/test-report.txt
              echo '```'
            else
              echo "Tests did not run (no output captured)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

      - name: Static analysis
        run: make analyze

      - name: Security analysis
        run: make security

      - name: Coverage
        run: make coverage

      - name: Upload coverage badge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: report/coverage/coverage-badge.json
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: report/coverage/
          if-no-files-found: ignore

      - name: Sanitizer (ASan/UBSan)
        run: make sanitize

      - name: Fuzzer smoke test
        run: make fuzzer-smoke

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: report/
          if-no-files-found: ignore

  coverage-status:
    name: Coverage
    needs: qa
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
    env:
      MIN_LINE_COVERAGE: 85
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage-report

      - name: Publish coverage summary
        id: summary
        if: always()
        run: ./scripts/coverage-github-summary.sh coverage-report/coverage-summary.json "${MIN_LINE_COVERAGE}"

      - name: Publish coverage check
        if: always() && steps.summary.outputs.line_percent != ''
        uses: actions/github-script@v7
        env:
          LINE_PCT: ${{ steps.summary.outputs.line_percent }}
          MEETS_THRESHOLD: ${{ steps.summary.outputs.meets_threshold }}
          MIN_LINE_COVERAGE: ${{ env.MIN_LINE_COVERAGE }}
        with:
          script: |
            const linePct = Number(process.env.LINE_PCT);
            const min = Number(process.env.MIN_LINE_COVERAGE);
            const meets = process.env.MEETS_THRESHOLD === 'true';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Line coverage',
              head_sha: context.sha,
              status: 'completed',
              conclusion: meets ? 'success' : 'failure',
              output: {
                title: `${linePct}% line coverage on src/`,
                summary: [
                  `Minimum required: ${min}%`,
                  meets ? 'Threshold met.' : 'Threshold not met.',
                ].join('\n\n'),
              },
            });

      - name: Enforce coverage threshold
        if: always() && steps.summary.outputs.meets_threshold == 'false'
        run: |
          echo "Line coverage ${LINE_PCT}% is below the required ${MIN_LINE_COVERAGE}%." >&2
          exit 1
        env:
          LINE_PCT: ${{ steps.summary.outputs.line_percent }}

  coverage-badge:
    name: Update coverage badge
    needs: [qa, coverage-status]
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage badge
        uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: badge

      - name: Commit coverage badge
        run: |
          if [ ! -f badge/coverage-badge.json ]; then
            echo "No coverage badge artifact found; skipping."
            exit 0
          fi

          mkdir -p .github/badges
          cp badge/coverage-badge.json .github/badges/coverage.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/badges/coverage.json
          if git diff --staged --quiet; then
            echo "Coverage badge unchanged."
            exit 0
          fi

          git commit -m "chore: update coverage badge [skip ci]"
          git push

  sbom:
    name: SBOM
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python tools
        run: |
          pipx install conan
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare Conan profile
        run: |
          PROFILE_PATH="$(./scripts/ci-conan-profile.sh)"
          echo "CONAN_PROFILE=${PROFILE_PATH}" >> "$GITHUB_ENV"
          echo "Using Conan profile at ${PROFILE_PATH}"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Generate SBOM
        run: ./scripts/sbom-generate.sh build report

      - name: SBOM summary
        run: |
          COMPONENT_COUNT="$(python3 -c "import json; print(len(json.load(open('report/sbom/cyclonedx.json'))['components']))")"
          {
            echo "## SBOM"
            echo "Generated CycloneDX SBOM with **${COMPONENT_COUNT}** Conan dependencies."
            echo ""
            echo "Submitted to GitHub Dependency Graph for this commit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit SBOM to GitHub Dependency Graph
        uses: evryfs/sbom-dependency-submission-action@v0.0.14
        with:
          sbom-files: report/sbom/cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: report/sbom/
          if-no-files-found: error
