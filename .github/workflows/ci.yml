name: Quality Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CC: clang
  CXX: clang++
  LLVM_VERSION: "22"
  CPPCHECK_VERSION: "2.21.1"
  FUZZER_TIME: 30
  MIN_LINE_COVERAGE: 85
  STRICT_CI: 1

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.diff.outputs.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect source changes
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          else
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "${RANGE}" | grep -qvE '^(docs/|\.github/badges/|.*\.md$)'; then
            echo "source=true" >> "$GITHUB_OUTPUT"
          else
            echo "source=false" >> "$GITHUB_OUTPUT"
          fi

  format-check:
    name: Format check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-beez
        with:
          install-conan: 'false'
          install-ccache: 'false'
          install-cmakelang: 'true'

      - name: Check formatting
        run: make format-check

      - name: Upload format report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-report
          path: report/format/
          if-no-files-found: ignore

  static-check:
    name: Static check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-beez
        with:
          install-llvm: 'false'
          install-conan: 'false'
          install-ccache: 'false'
          install-cppcheck: 'true'

      - name: Run cppcheck
        run: make static-check

      - name: Upload static analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-check-report
          path: report/analyze/
          if-no-files-found: ignore

  build-test:
    name: Build and test
    needs: detect-changes
    if: needs.detect-changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-beez

      - name: Build (Release)
        run: make build

      - name: Run tests
        run: make test

      - name: Run clang-tidy
        run: make tidy-ci

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Test results"
            if [ -f report/test/test-report.txt ]; then
              echo '```'
              tail -n 40 report/test/test-report.txt
              echo '```'
            else
              echo "Tests did not run (no output captured)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-reports
          path: report/
          if-no-files-found: ignore

  coverage:
    name: Coverage
    needs: detect-changes
    if: needs.detect-changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-beez
        with:
          install-gcovr: 'true'

      - name: Generate coverage report
        run: make coverage

      - name: Upload coverage badge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: report/coverage/coverage-badge.json
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: report/coverage/
          if-no-files-found: ignore

  sanitize:
    name: Sanitizer
    needs: detect-changes
    if: needs.detect-changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-beez

      - name: Run ASan/UBSan tests
        run: make sanitize

      - name: Upload sanitizer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitize-report
          path: report/sanitize/
          if-no-files-found: ignore

  fuzzer:
    name: Fuzzer smoke
    needs: detect-changes
    if: needs.detect-changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-beez

      - name: Run fuzzer smoke test
        run: make fuzzer-smoke

      - name: Upload fuzzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzer-report
          path: report/fuzz/
          if-no-files-found: ignore

  thread-sanitizer:
    name: ThreadSanitizer
    needs: detect-changes
    if: needs.detect-changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-beez

      - name: Run ThreadSanitizer tests
        run: make tsan

      - name: Upload TSan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-report
          path: report/tsan/
          if-no-files-found: ignore

  sbom:
    name: SBOM and dependency audit
    needs: detect-changes
    if: needs.detect-changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-beez
        with:
          install-ccache: 'false'
          install-osv-scanner: 'true'

      - name: Generate SBOM
        run: make sbom

      - name: Run dependency audit
        env:
          DEPENDENCY_AUDIT_SBOM: ${{ github.workspace }}/report/sbom/cyclonedx.json
        run: make dependency-audit

      - name: SBOM summary
        run: |
          COMPONENT_COUNT="$(python3 -c "import json; print(len(json.load(open('report/sbom/cyclonedx.json'))['components']))")"
          {
            echo "## SBOM"
            echo "Generated CycloneDX SBOM with **${COMPONENT_COUNT}** Conan dependencies."
            echo ""
            echo "Submitted to GitHub Dependency Graph for this commit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit SBOM to GitHub Dependency Graph
        uses: evryfs/sbom-dependency-submission-action@v0.0.14
        with:
          sbom-files: report/sbom/cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: report/sbom/
          if-no-files-found: error

  coverage-status:
    name: Coverage status
    needs: [detect-changes, coverage]
    if: always() && needs.detect-changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage-report

      - name: Publish coverage summary
        id: summary
        if: always()
        run: ./scripts/coverage-github-summary.sh coverage-report/coverage-summary.json "${MIN_LINE_COVERAGE}"

      - name: Publish coverage check
        if: always() && steps.summary.outputs.line_percent != ''
        uses: actions/github-script@v7
        env:
          LINE_PCT: ${{ steps.summary.outputs.line_percent }}
          MEETS_THRESHOLD: ${{ steps.summary.outputs.meets_threshold }}
          MIN_LINE_COVERAGE: ${{ env.MIN_LINE_COVERAGE }}
        with:
          script: |
            const linePct = Number(process.env.LINE_PCT);
            const min = Number(process.env.MIN_LINE_COVERAGE);
            const meets = process.env.MEETS_THRESHOLD === 'true';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Line coverage',
              head_sha: context.sha,
              status: 'completed',
              conclusion: meets ? 'success' : 'failure',
              output: {
                title: `${linePct}% line coverage on src/`,
                summary: [
                  `Minimum required: ${min}%`,
                  meets ? 'Threshold met.' : 'Threshold not met.',
                ].join('\n\n'),
              },
            });

      - name: Enforce coverage threshold
        if: always() && steps.summary.outputs.meets_threshold == 'false'
        run: |
          echo "Line coverage ${LINE_PCT}% is below the required ${MIN_LINE_COVERAGE}%." >&2
          exit 1
        env:
          LINE_PCT: ${{ steps.summary.outputs.line_percent }}

  coverage-badge:
    name: Update coverage badge
    needs: [detect-changes, coverage, coverage-status]
    if: always() && !cancelled() && needs.detect-changes.outputs.source == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage badge
        uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: badge

      - name: Commit coverage badge
        run: |
          if [ ! -f badge/coverage-badge.json ]; then
            echo "No coverage badge artifact found; skipping."
            exit 0
          fi

          mkdir -p .github/badges
          cp badge/coverage-badge.json .github/badges/coverage.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/badges/coverage.json
          if git diff --staged --quiet; then
            echo "Coverage badge unchanged."
            exit 0
          fi

          git commit -m "chore: update coverage badge [skip ci]"
          git push

  ci-success:
    name: CI
    needs:
      - detect-changes
      - format-check
      - static-check
      - build-test
      - coverage
      - sanitize
      - fuzzer
      - thread-sanitizer
      - sbom
      - coverage-status
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all required jobs passed
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          FORMAT_CHECK_RESULT: ${{ needs.format-check.result }}
          STATIC_CHECK_RESULT: ${{ needs.static-check.result }}
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SANITIZE_RESULT: ${{ needs.sanitize.result }}
          FUZZER_RESULT: ${{ needs.fuzzer.result }}
          TSAN_RESULT: ${{ needs.thread-sanitizer.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
          COVERAGE_STATUS_RESULT: ${{ needs.coverage-status.result }}
          SOURCE_CHANGED: ${{ needs.detect-changes.outputs.source }}
        run: |
          failed=0

          check_result() {
            local name="$1"
            local result="$2"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "Job failed: ${name} (${result})" >&2
              failed=1
            fi
          }

          check_result "detect-changes" "${DETECT_CHANGES_RESULT}"
          check_result "format-check" "${FORMAT_CHECK_RESULT}"
          check_result "static-check" "${STATIC_CHECK_RESULT}"
          check_result "coverage-status" "${COVERAGE_STATUS_RESULT}"

          if [ "${SOURCE_CHANGED}" = "true" ]; then
            check_result "build-test" "${BUILD_TEST_RESULT}"
            check_result "coverage" "${COVERAGE_RESULT}"
            check_result "sanitize" "${SANITIZE_RESULT}"
            check_result "fuzzer" "${FUZZER_RESULT}"
            check_result "thread-sanitizer" "${TSAN_RESULT}"
            check_result "sbom" "${SBOM_RESULT}"
          else
            echo "Docs-only change detected; skipping build and test jobs."
          fi

          if [ "${failed}" -ne 0 ]; then
            echo "One or more required CI jobs failed." >&2
            exit 1
          fi

          echo "All required CI jobs passed."
