name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and the behavior you want. For large features, a short design note helps reviewers.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish? Who benefits?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should Beez behave? CLI flags, DSL changes, config keys, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or tools you considered.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Beez is most affected?
      options:
        - CLI
        - Lua DSL / build.lua
        - Caching
        - Configuration
        - Terminal UI / output
        - Performance / parallelism
        - Documentation
        - Build / CI / tooling
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests for duplicates
          required: true
